# docker-compose.full-stack.yml
#
# One-shot infra bringup for the PROTEA dev/CI stack.
#
# This file covers the INFRASTRUCTURE layer only:
#   - postgres (pgvector/pg16) - primary database
#   - rabbitmq (3-management)  - message broker
#   - minio                    - artifact object store
#   - prometheus               - metrics scraper        [monitoring profile]
#   - grafana                  - dashboard              [monitoring profile]
#   - loki                     - log aggregation        [monitoring profile]
#   - promtail                 - log shipper            [monitoring profile]
#   - postgres-exporter        - DB metrics exporter    [monitoring profile]
#
# The PROTEA application processes (API, workers, frontend) are intentionally
# NOT containerised here. Use `scripts/manage.sh start` on the host after
# this compose stack is healthy.
#
# Usage:
#
#   # Infra only (postgres, rabbitmq, minio):
#   docker compose -f infra/compose/docker-compose.full-stack.yml \
#     --profile infra up -d
#
#   # Infra + observability sidecars:
#   docker compose -f infra/compose/docker-compose.full-stack.yml \
#     --profile infra --profile monitoring up -d
#
#   # Tear down everything cleanly:
#   docker compose -f infra/compose/docker-compose.full-stack.yml \
#     --profile infra --profile monitoring down -v
#
# Environment variables (all have sane defaults for local dev):
#
#   POSTGRES_USER          (default: protea)
#   POSTGRES_PASSWORD      (default: protea)
#   POSTGRES_DB            (default: protea)
#   RABBITMQ_DEFAULT_USER  (default: guest)
#   RABBITMQ_DEFAULT_PASS  (default: guest)
#   MINIO_ROOT_USER        (default: minioadmin)
#   MINIO_ROOT_PASSWORD    (default: minioadmin)
#   SLACK_WEBHOOK_URL      (default: empty, Grafana boots fine without it)
#   POSTGRES_EXPORTER_DATA_SOURCE_NAME  (default: dev creds via host-gateway)
#
# Named volumes:
#   protea_postgres_data  - persisted across restarts; wipe with `down -v`
#   protea_minio_data     - object store blobs
#   protea_grafana_data   - Grafana dashboards + alert state
#   protea_prometheus_data - TSDB (15-day retention by default)
#   protea_loki_data      - compressed log chunks

name: protea-full-stack

services:

  # ---------------------------------------------------------------------------
  # postgres (pgvector/pg16) — primary relational store
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["infra"]
    container_name: protea-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-protea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-protea}
      POSTGRES_DB: ${POSTGRES_DB:-protea}
    volumes:
      - protea_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-protea}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - protea_infra

  # ---------------------------------------------------------------------------
  # rabbitmq (3-management) — AMQP message broker + management UI
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    profiles: ["infra"]
    container_name: protea-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
      # rabbitmq_prometheus plugin metrics endpoint; enabled in both the
      # 3-management image (default) and a plain 3 image when an
      # enabled_plugins file activates it explicitly.
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - protea_infra

  # ---------------------------------------------------------------------------
  # minio — S3-compatible artifact object store
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    profiles: ["infra"]
    container_name: protea-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - protea_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - protea_infra

  # ---------------------------------------------------------------------------
  # prometheus — metrics scraper (monitoring profile)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    container_name: protea-prometheus
    # Scrapes the PROTEA API /metrics endpoint via host.docker.internal,
    # plus RabbitMQ (:15692) and postgres-exporter (:9187) by container
    # name over the shared infra network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - protea_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - protea_infra
      - protea_monitoring

  # ---------------------------------------------------------------------------
  # grafana — dashboard + alerting UI (monitoring profile)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    container_name: protea-grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Grafana 11 expands ${SLACK_WEBHOOK_URL} inside provisioned contact-point
      # YAML at startup; unset = empty URL, Grafana boots fine (no 4xx storm).
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    ports:
      - "3001:3000"
    volumes:
      - protea_grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - protea_monitoring

  # ---------------------------------------------------------------------------
  # loki — log aggregation backend (monitoring profile)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.2.1
    profiles: ["monitoring"]
    container_name: protea-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      # Published so the loki-docker-driver plugin (which lives in the host
      # docker daemon namespace) can push to http://localhost:3100.
      - "3100:3100"
    volumes:
      - protea_loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - protea_monitoring

  # ---------------------------------------------------------------------------
  # promtail — log shipper: tails host log files and forwards to loki
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.2.1
    profiles: ["monitoring"]
    container_name: protea-promtail
    # Tails process-stack log files (uvicorn, workers, Next.js) written by
    # manage.sh into the PROTEA repo's ./logs/ directory on the host.
    # The /var/log/protea bind-mount is read-only; promtail never modifies
    # application log files.
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/log/protea:/var/log/protea:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9080/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - protea_monitoring

  # ---------------------------------------------------------------------------
  # postgres-exporter — exposes Postgres metrics for Prometheus (monitoring profile)
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["monitoring"]
    container_name: protea-postgres-exporter
    # Reaches Postgres via host-gateway so it works whether Postgres was
    # started by this compose file or by the host manage.sh stack.
    # Override DATA_SOURCE_NAME in the environment for non-default creds.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATA_SOURCE_NAME=${POSTGRES_EXPORTER_DATA_SOURCE_NAME:-postgresql://protea:protea@host.docker.internal:5432/protea?sslmode=disable}
    ports:
      - "9187:9187"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9187/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - protea_monitoring
      - protea_infra

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  protea_postgres_data:
    # Persisted across stack restarts. Wipe with `docker compose down -v`
    # or `docker volume rm protea-full-stack_protea_postgres_data`.
  protea_minio_data:
  protea_grafana_data:
  protea_prometheus_data:
  protea_loki_data:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  protea_infra:
    # Shared by infra services; prometheus attaches here to scrape rabbitmq
    # and postgres-exporter by container name without publishing extra ports.
    driver: bridge
  protea_monitoring:
    # Isolated bridge for observability sidecars. Only postgres-exporter
    # joins both networks so prometheus can reach it.
    driver: bridge
