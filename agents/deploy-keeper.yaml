# deploy-keeper — keep protea.ngrok.app serving HEAD of origin/develop.
#
# Architecture: bash supervisor loops forever, calls tick.sh every
# poll_interval. The supervisor itself is NEVER invoked as an LLM:
# happy path is pure bash, and on non-prereq failure it spawns a
# janitor subagent (via scripts/spawn-subagent.sh) which handles the
# diagnosis + recovery. Lifetime LLM cost of deploy-keeper itself is $0.

name: deploy-keeper
kind: headless
persistent: true
model: opus             # nominal model; supervisor never spawns it
permissions: bypassPermissions  # trusted; redeploys + ngrok mgmt require shell

worktree:
  base_branch: origin/develop
  cleanup: none              # uses existing deploy worktree, for Docker/npm
                             # cache reuse. DO NOT ephemeralize.
  path: ~/Thesis2/worktrees/protea-deploy
                             # stable path; cleanup.sh + worktree-remove hook
                             # read this to protect against accidental removal.

service:
  poll_interval: 5m
  triggers:
    - new_commit_on:origin/develop
    - ngrok_tunnel_down
    - manual

tools_allowed: [Bash, Read, Write]
timeout_hours: 0             # persistent, never times out

system_prompt_file: prompts/deploy-keeper.md
                             # placeholder only; supervisor never reads
                             # this file to spawn an LLM. Retained so
                             # spawn.sh's yaml-load doesn't break.

cost_budget:
  expected_tokens: 0         # supervisor is pure bash; janitor escalation
                             # cost is billed against janitor's budget
  max_usd_per_day: 0.00      # deploy-keeper itself never spends
