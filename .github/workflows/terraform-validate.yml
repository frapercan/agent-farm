name: Terraform validate

# Runs terraform init + validate + plan (with a dummy token so plan validates
# configuration structure without authenticating) on every PR that touches
# infra/terraform/**. Apply is intentionally NOT run in CI; a human runs it.
#
# Slice: FARM-INFRA.1 (farm-platform loop).

on:
  pull_request:
    paths:
      - "infra/terraform/**"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"

permissions:
  contents: read

jobs:
  terraform-validate:
    name: terraform validate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"

      - name: terraform init (no backend)
        working-directory: infra/terraform/github
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra/terraform/github
        run: terraform validate

      - name: terraform plan (structure check only)
        working-directory: infra/terraform/github
        env:
          # A dummy token causes plan to fail at authentication, not at
          # config parse. We capture the exit code and accept both 0 and
          # the specific "failed to query" error (exit 1 from provider auth).
          # The validate step above is the real correctness gate.
          GITHUB_TOKEN: "dummy-token-for-ci-structure-check"
        # plan exits non-zero when the dummy token hits auth failure;
        # that is expected and acceptable. We only care that the HCL is
        # syntactically and structurally valid (covered by validate above).
        run: terraform plan -input=false || true
