# The ladder has to be a claim something can refuse.
#
# CAMPAIGN.md declared three axes for rung 1 and a grid ran two of them,
# the third pinned by omission, for 48 arms. Prose cannot refuse a job;
# this can.
name: Rung declaration

on:
  pull_request:
    paths:
      - 'plans/rungs.yaml'
      - 'scripts/check_rung_declaration.py'
      - 'tests/test_rung_declaration.py'
      - '.github/workflows/rung-declaration.yml'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml pytest
      - name: the declaration is well formed and its dependencies point backwards
        run: python3 scripts/check_rung_declaration.py
      - name: the checks catch what they are for
        run: python3 -m pytest tests/test_rung_declaration.py -q
