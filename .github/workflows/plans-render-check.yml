name: Plans render check

on:
  pull_request:
    paths:
      - 'plans/**/*.md'
      - 'plans/render.py'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 plans/render.py --check
