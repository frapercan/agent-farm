# ARCHIVED 2026-08-28. This declares the ladder, and the campaign is a graph.
#
# It is kept, not deleted, because the machine-checkable declaration was the
# right idea: prose cannot refuse a job, and this file could. What it declares
# is what has been superseded. The experiment graph replaces the five rungs with
# ten nodes, each carrying an edge whose strength is one of measured, chosen,
# inherited, unpowered or blocked, and a cardinality that is a vector over nine
# panels rather than a scalar.
#
# Nothing reads this any more. scripts/check_rung_declaration.py and
# .github/workflows/rung-declaration.yml went with it, because a green check
# that enforces a retired claim is worse than no check: it reports that the
# trunk agrees with a campaign nobody is running.
#
# What should replace it is a declaration of the graph that a job can be refused
# against. That does not exist yet, and saying so here is the point of keeping
# the file.

# THE LADDER, IN A FORM SOMETHING CAN CHECK
#
# CAMPAIGN.md section 5 declares five rungs, each with one question and one
# gate. It has been right and unread: on the night of 2026-08-19 a grid ran
# 48 arms of the declared rung 1 while varying two of its three axes, the
# third pinned by omission to the weakest available value, and nothing
# objected. Four hundred jobs were then tagged with a rung number invented
# at dispatch time and nothing objected to that either.
#
# The failure was not that the design was missing. It was that the design
# was prose, and prose cannot refuse a job.
#
# This file is the same ladder in a form CI can read. It does not replace
# CAMPAIGN.md, which carries the reasoning; it carries the claims that have
# to hold, so that a job whose varied axes contradict its declared rung
# fails before it runs rather than after it publishes.
#
# Fields per rung:
#   question   what the rung asks, in one sentence
#   axes       what VARIES. Each names the payload or config field that
#              carries it, so a dispatched job can be checked against it.
#   held       what is FIXED, and which rung decided it. This is what makes
#              the ladder a ladder: rung N's held constants are rung N-1's
#              answers, so an answer that later changes invalidates every
#              rung standing on it.
#   gate       floor: what must be true for the result to mean anything
#              rank: what the winner is chosen by
#   winner     per_cell or global
#   status     declared | running | closed | reopened | parked
#              parked means deliberately not now, with the reason and the
#              cost recorded, so it reads as a decision rather than as an
#              oversight. The difference between those two is what this
#              file exists for.
#
# WHY EACH RUNG HOLDS AN AXIS THAT MOVES THE SCORE MORE THAN THE ONE IT
# VARIES, WHICH IS NOT AN ACCIDENT AND WILL KEEP HAPPENING
#
# Measured, three rungs in:
#
#   rung 1   backbone spread at the best K   0.0230
#            spread within a backbone across K   0.0527
#   rung 2   the fitted map buys              +0.0022 on the aggregate
#            K takes every arm from 0.32 to 0.27 across the same sweep
#
# So in both cases the held axis moved the number more than the studied
# one, by a factor of two and then of fifteen. A reader meeting that
# three times will ask whether the ladder is ordered by importance, and
# the honest answer is that it is not.
#
# It is ordered by WHAT HAS TO BE DECIDED BEFORE THE NEXT THING CAN BE
# BUILT. The encoding has to be settled before a classifier can be
# trained on top of it, whether or not the encoding is where the points
# are. A rung is a decision the following rung stands on, and a decision
# can be small and still be load-bearing.
#
# Two consequences worth stating rather than discovering:
#
#   A rung can be worth running and produce a flat table. Rung 2's
#   aggregate is nearly flat across three encodings and the finding is
#   underneath it, in the identity bands, where the same arms differ by
#   +0.0091 and -0.0023 with opposite signs. A flat aggregate is a
#   result about the population, not about the arms.
#
#   The size of an axis is not an argument for varying it. K moves the
#   score most and is held everywhere after rung 1, because rung 1
#   settled it and re-opening it in every later rung would measure the
#   same thing repeatedly instead of measuring what is new.

version: 2
source: plans/CAMPAIGN.md section 5
revised: 2026-08-20
revision_note: >
  Renumbered to the document after two months of drift. The scoring axis
  was being called rung 2 and is rung 1's third declared axis; the encoding
  grid was being called rung 3 and is the declared rung 2. Rungs 6 and 7 are
  new and are not in CAMPAIGN.md prose yet.

# The gate, revised. CAMPAIGN.md says the gate is retrieval quality until
# the last rung, on the premise that the board metric is a poor instrument
# for ranking mechanisms. Measured on this corpus the retrieval proxy is
# worse: neighbour purity divides by the neighbour's own annotation count,
# so it rewards retrieving sparsely annotated donors, and it inverted
# against the task twice with both sides separating. Retrieval quality is
# kept as a FLOOR, which is what a gate properly is, and ranking moves to
# the task metric.
# How every rung reports. Not a rung: a property of all of them.
#
# CLAUDE.md already says "ALWAYS stratify every reported metric; there is
# no such thing as an aggregate result", and CAMPAIGN.md rung 1 already
# says per-cell winner rather than global. Neither was being done, and on
# 2026-08-20 the cost was measured.
#
# Chapter 6 concludes from a global backbone spread of 0.0188 that the
# representation barely matters, and sets a ceiling on what later rungs can
# gain from swapping language models. Split by identity band, at K=1, in
# the no-knowledge cell:
#
#     twilight <=30       best 0.2893  worst 0.2045   spread 0.0848
#     near-identical >90   best 0.3745  worst 0.3664   spread 0.0081
#
# Ten and a half times. Per-cell medians run 0.1316, 0.0388, 0.0293, 0.0155
# down the identity axis. The global number is dominated by the band where
# a near-identical donor already exists, where an 8M-parameter model sits
# 0.4 points off a 650M one and the choice genuinely does not matter. In
# the band this project exists to serve, the same model is 8.5 points
# behind and last.
#
# The conclusion was not distorted by aggregation. It was inverted by it.
reporting:
  stratify: required
  axes: [category, aspect, length, homology]
  winner: per_cell
  forbidden: >
    A spread, a ceiling or a null reported over the whole population. Any
    such number already on record is provisional until stratified,
    including nulls: on 2026-08-20 stratification inverted one conclusion
    and confirmed another, which is what makes it a check rather than a
    preference.
  # The objection nobody has raised yet: this project already stratifies.
  # It does, on length, and length does not separate. Same computation,
  # same arms, spread across the eight representations per cell:
  #
  #     by homology   <=30 0.1316   30-60 0.0388   60-90 0.0293   >90 0.0155
  #     by length    <=512 0.0323   512-1024 0.0388   1024-2048 0.1336 (2 cells)
  #
  # Homology is monotone over a factor of 8.5. Length ties. And the largest
  # spread inside each length band, 0.1733 and 0.1641, IS the twilight
  # maximum, so the variation length appears to carry is homology's,
  # scattered across length bands. A table stratified by length looks like
  # a stratified table and hides the effect exactly as an aggregate would.
  # The rule was not ignored; it was honoured on the inert axis, and that
  # is what made the omission invisible.
  # What carries the hard band, measured 2026-08-20 at K=30 inside the
  # twilight no-knowledge cell. Precision at the head of each protein's own
  # ranking, chance at 0.031:
  #
  #     composite        top-1 0.239   vote_fraction   0.220
  #     embedding_only         0.156   alignment_only  0.059
  #
  # Three things follow and none of them was obvious.
  #
  # alignment_only is not failing to order. It resolves 26 distinct values
  # per protein against vote_fraction's 14, and still lands at 1.9 times
  # chance where the others reach 5 to 7.7. Below thirty per cent identity
  # the alignment score orders donors almost at RANDOM, which is a
  # different claim from failing to discriminate and the one the data
  # supports.
  #
  # Few values used well beat many used badly, so scorer resolution was
  # never the variable.
  #
  # And embedding_only, the embedding's own similarity, is a weak ranker
  # there at 0.156 while vote_fraction reaches 0.220. What carries the band
  # is the AGREEMENT among the neighbours the embedding retrieved, which is
  # derived from the embedding and is not its similarity. In the band this
  # project exists to serve, the useful signal is neither sequence identity
  # nor embedding similarity. It is neighbourhood consensus.
  what_carries_the_hard_band: >
    Neighbourhood consensus, not sequence identity and not embedding
    similarity. Any arm judged on twilight is judged on whether the
    neighbourhood it produces agrees, and an arm optimised for a correct
    top hit is optimised for something else.

  # What a comparison costs, measured 2026-08-20. Two arms on the same
  # proteins do not buy the same resolution, and the difference is a
  # property of what varies rather than of the machinery:
  #
  #     comparing two SCORERS    median half-width 0.0040 on 382-669 proteins
  #     comparing two ENCODERS                     0.0262 on 649 proteins
  #
  # A scorer comparison holds retrieval fixed, so the pairing absorbs the
  # same donors, the same candidate terms and the same protein, and only
  # the weighting varies. An encoder comparison changes which donors are
  # retrieved, so the paired difference carries the retrieval's own
  # variance. Six times the half-width means roughly thirty-six times the
  # proteins for equal resolution.
  #
  # It bites because the largest per-cell effect this ladder has produced
  # is 0.0088. An encoder test at 0.026 cannot detect any lever the
  # campaign has found, so a null from one is not a negative result at
  # this scale: it measured nothing.
  #
  # And the obvious remedy does not work. The windows are NESTED in time,
  # so pooling them buys 3.7 per cent rather than the eighty per cent a
  # naive sum suggests: union 1,869 against 2,367 if disjoint. Only a
  # window ending at or before this one's t0 adds population, and that is
  # a different frame needing its own exchangeability argument.
  what_a_comparison_costs: >
    Hold retrieval fixed and a comparison resolves 0.004; let it vary and
    the same proteins resolve 0.026. Plan the population from what varies,
    not from the sample size, and check whether candidate windows are
    nested before counting on their sum.

  length_is_not_a_substitute: >
    Stratifying by length does not discharge this requirement. Homology is
    the axis that separates; length redistributes it.
  self_match: >
    Homology bands exclude the query's own sequence, by sequence_id rather
    than by accession, because isoforms and re-annotations carry the same
    sequence under a different name. Including it moves the median identity
    from 41.2 to 100.0 and puts 88 per cent of the corpus in the
    near-identical band.

gate_policy:
  floor: retrieval quality, asking only whether enough was retrieved that success is possible
  rank: the task metric
  standing_rule: >
    Two different architectures are never ranked on a retrieval proxy.
    Measured inversions: +0.0122 purity against -0.0237 Fmax on one arm,
    both separating.

rungs:
  - number: 1
    title: the weighted-score benchmark
    question: >
      Across protein language models, neighbourhood sizes and score
      weightings, which combination retrieves the best candidate set?
    axes:
      - name: backbone
        field: payload.embedding_config_id
        measured_spread: 0.022
        note: at K=1. Close to a null; an 8M-parameter model sits 2.2 points off the best.
      - name: neighbourhood_size
        field: payload.limit_per_entry
        measured_spread: 0.099
        note: >
          Under the None-scoring fallback this is close to an arithmetic
          property rather than a finding: neighbours arrive in distance
          order and nothing aggregates them, so raising K can only append
          lower-scored candidates. Re-measure after the scoring axis closes.
      - name: score_weighting
        field: payload.scoring_config_id
        measured_spread: 0.070
        note: >
          Never varied until 2026-08-20. Absent means the None fallback,
          which is arithmetically embedding_only, second from bottom of the
          seven configs. Absence is a choice and must be declared.
    held:
      - what: temporal window
        value: GOA 220 to GOA 230
        decided_by: campaign
      - what: retriever
        value: embedding k-nearest-neighbour
        decided_by: campaign
        note: >
          Held in every arm ever run and never declared as a choice until
          now. Rung 7 is what tests it.
    gate: one frozen substrate, chosen on validation, per cell
    winner: per_cell
    status: running

  - number: 2
    title: the learned representation as the lever
    question: Does the learned sparse encoder beat the winner of rung 1 at equal input?
    axes:
      - name: encoding
        field: payload.embedding_config_id
        note: dense pretrained, dense fitted control, sparse pooled, sparse per residue
      - name: layer
        field: embedding_config.layer_indices
        note: >
          Two recorded ablations disagree and neither has been reconciled:
          on pooled embeddings mid layers win, on the per-residue sparse
          code the last layer wins. Fixing it by assumption inside the rung
          whose purpose is to settle the encoding repeats rung 1's mistake.
      - name: quantisation
        field: embedding_config
        note: separate configs, never a property of one, so an artifact is identified by its id
    held:
      - what: score weighting
        value: the winner of rung 1
        decided_by: rung 1
        note: >
          Blocking. The encoding null on record was measured against the
          fallback scorer, not against rung 1's winner, so the comparison
          this rung specifies has not yet been made.
      - what: neighbourhood size
        value: the winner of rung 1
        decided_by: rung 1
    gate: >
      Every fitted artifact declares the annotation release it was fitted
      against, and CI refuses one whose cut falls inside the frame it is
      about to be scored in.
    winner: per_cell
    status: closed
    result: >
      No arm beats any other. Across the nine category-by-aspect cells at
      K=1, over 104 arms per cell, the margin between first and second
      never exceeds 0.0015, and in five of the nine the second place is the
      SAME encoding under a different weighting. The winner this rung
      declares per cell cannot be determined, and that is the finding
      rather than a gap in the measurement.

      What separates arms is the channel, not the encoding. Holding the
      weighting fixed, the four encodings spread 0.0540 under
      embedding_only at K=30 and 0.0025 under composite_no_embedding, whose
      weight on embedding similarity is exactly 0.0 and which wins 72.7 per
      cent of cells. The layer axis reproduces it: layer 48 beats layer 10
      in all sixteen comparisons, by 0.0307 through embedding_only at K=3
      and 0.0026 through composite_no_embedding, an attenuation of about
      twelve.

      And in half the prior-knowledge cells the four encodings score
      IDENTICALLY to six decimals, which is stronger than a small
      difference because it is falsifiable: they retrieve the same
      neighbours and transfer the same terms. In the regime this project
      names as its frontier, the representation does not participate.

      And the ties are not merely small, they are smaller than chance
      would produce. PR 243 priced the noise floor for a maximum taken over
      many arms: about 0.0094 for 120 null arms. Calibrating from that and
      extrapolating gives 0.0093 for the 104 arms in one cell here and
      0.0108 for the 528 in the grid. Every margin measured is five to
      seven times below it:

        largest first-to-second margin across the nine cells   0.0015
        ProtST over ankh-base on the board                     0.0021
        spread between the four encodings at K=1               0.0019

      So the absence of a winner is what this grid should have been
      expected to produce, and the finding has an explanation rather than
      only evidence. That argument was written on 2026-08-12, before this
      rung ran, and was still an unmerged PR when the rung closed.

      So the retrieval axis is closed by measurement. What limits the
      result is the ordering of candidates already retrieved, which rung 3
      is the first rung to address.
    axes_measured:
      encoding: >
        four levels: pretrained ankh-base, dense fitted map, sparse pooled
        map at 128 of 2048 atoms, sparse per-residue. Six values of K, nine
        weightings, three knowledge regimes, banded by identity.
      layer: >
        two levels on ankh-base, [0] and [10] of 48 under the reverse
        convention. Never varied before this rung: all eleven configs in
        the database carried [0], including rung 1's eight backbones, so
        the axis had been pinned by omission exactly as rung 1's was.
      quantisation: >
        NOT registered as separate configs, which is what this rung asks
        for. Measured as an analysis: 4 bits at 240 bytes against 688,
        65 per cent saving, free on the metric in every band and preserving
        the tie structure, where 1 bit degenerates the ranking. The finding
        stands; its registration as identifiable artifacts does not.

  - number: 3
    title: the functional classifier
    question: What does a full-vocabulary classifier add that neighbour retrieval cannot reach?
    axes:
      - name: generator
        field: payload.compute_classifier
    held:
      - what: encoding
        value: the sparse pooled map, 128 of 2048 atoms
        decided_by: chosen, NOT measured
        note: >
          Rung 2 closed without a winner: nine cells, 104 arms each, and no
          margin above 0.0015. So this value is a CHOICE and is recorded as
          one, because a held constant that reads as an answer when it was a
          preference is how a ladder starts carrying claims it never made.

          Chosen on three grounds, none of them a score. It is
          indistinguishable from every other arm on the metric. It reaches
          that on 128 atoms of 2048, so it is the cheapest to serve and to
          store. And it leads the other three in three of the four identity
          bands of the no-knowledge regime, which is where this rung's own
          question lives.

          Anything rung 3 concludes must survive substituting another
          encoding, since rung 2 says they are interchangeable. If it does
          not, the conclusion is about the encoding rather than about the
          classifier, and this note is where a reader should be sent.
    gate: candidate-set improvement per cell, at matched volume, with intervals
    winner: per_cell
    status: declared

  - number: 4
    title: signal integration
    question: Which signals compose, and where?
    axes:
      - name: feature_family
        field: payload.compute_*
        note: measured by removal, per cell, with an interval
    held:
      - what: generators
        value: everything rungs 1 to 3 selected
        decided_by: rungs 1-3
    gate: composition measured, not assumed
    winner: per_cell
    deliverable: the signal registry, which is the product of this rung rather than a by-product
    status: declared

  - number: 5
    title: ensembling
    question: Does combining models beat the best single model, by a mechanism we can name?
    axes:
      - name: ensemble_form
        field: null
        note: seed, representation and generator ensembling, measured separately because they fail differently
    held:
      - what: composition
        value: the winner of rung 4
        decided_by: rung 4
    gate: named mechanism, not a score
    winner: global
    status: declared

  # Rungs 6 and 7 are new. Neither is in CAMPAIGN.md prose yet and both came
  # out of measurement rather than design.
  # Rung 6 was per-stratum policy. It has been withdrawn as a rung and
  # promoted into `reporting` above, because the measurement that motivated
  # it also showed it was the wrong shape: if a global number can invert
  # under stratification, then stratification is not a step to take after
  # the others, it is the condition under which any of them mean anything.
  # What remains genuinely open is what to DO differently per stratum, and
  # that is a question for a rung to be written once the ladder's own
  # numbers are stratified and we can see where the gaps are.

  - number: 7
    title: the retriever
    question: >
      Does embedding retrieval propose better candidates than alignment
      retrieval, at equal bank and equal scoring?
    new: true
    rationale: >
      Every arm ever run retrieved by embedding k-nearest-neighbour. It was
      never varied and never declared as a choice. Measured on one rung-1
      set, 657,362 of 657,362 candidate rows carry an embedding distance and
      a named donor, so there is no other generator: an alignment score can
      only rank a donor the embedding already retrieved. That makes every
      result to date a statement about scoring, and leaves the title's claim
      untested. Three outcomes and all three are publishable: the embedding
      retrieves better, and the contribution is retrieval; they tie, and the
      contribution is cost; alignment retrieves better, and the premise
      needs restating before a viva rather than during one.
    # Reframed 2026-08-20. The question is no longer only whether the
    # embedding proposes better candidates than alignment does. Consensus
    # is what carries the twilight band, so what matters about a retriever
    # there is whether the neighbourhood it returns AGREES, not whether its
    # top hit is right. Those are different objectives and a retriever can
    # win one while losing the other, so the rung has to measure both or it
    # will answer a question nobody asked.
    secondary_question: >
      Does alignment retrieval produce a neighbourhood that AGREES as well
      as one whose top hit is right? Measured as consensus among the
      returned donors, not as top-hit accuracy.
    axes:
      - name: retriever
        field: payload.search_backend
        note: >
          Requires a backend that is not vector search. numpy and faiss are
          both vector search. Pairwise parasail cannot do it: 22,498 queries
          against 528,294 bank sequences is 11.9 billion alignments.
    held:
      - what: bank, queries, scoring, temporal window
        value: identical to rung 1
        decided_by: rung 1
    gate: >
      The alignment retriever is a registered operation, per the campaign
      invariant that no artifact exists without one.
    winner: per_cell
    status: parked
    parked:
      on: 2026-08-20
      by: the author
      reason: >
        Deliberately not now. It is the experiment that tests the title and
        it deserves its own chapter rather than a corner of a rung that is
        already running, and it cannot be read until the scoring axis names
        a winner to hold fixed.
      cost_when_resumed:
        retrieval: >
          22,498 queries against 528,294 bank sequences. Minutes on 16 cores
          with DIAMOND or MMseqs2. Neither is installed; both are a new
          external dependency and would have to be a registered operation.
        not_reusable: >
          The 2,059,944 pairs in the alignment cache are exactly the pairs
          the embedding retriever proposed, so they are a sample biased by
          the hypothesis under test and cannot serve as the search.
        infeasible_alternative: >
          Pairwise parasail, which is what the project has, would be 11.9
          billion alignments.
      outcomes:
        - the embedding retrieves better, and the contribution is retrieval rather than discrimination
        - they tie, and the contribution is cost, since vector search is orders of magnitude cheaper
        - alignment retrieves better, and the premise is restated before a viva rather than during one
